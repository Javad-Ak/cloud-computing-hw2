services:
  db:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://db:6379"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.bonus
    environment:
      PORT: "8000"
      QUEUE_BACKEND: "${QUEUE_BACKEND:-redis}"
      REDIS_URL: "${REDIS_URL:-redis://db:6379/0}"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
      - db-exporter

volumes:
  redis-data:
  prometheus-data: