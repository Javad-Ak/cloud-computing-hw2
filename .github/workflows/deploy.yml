name: Manual Deploy Tag to Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout requested Git tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Inject tag version into index.html
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          sed -i "s/__VERSION__/${VERSION}/g" part2/site/index.html
          cat part2/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: part2/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4